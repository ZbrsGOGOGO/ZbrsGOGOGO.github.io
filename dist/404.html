<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="4; url=/" />
    <title>页面未找到 · borui zhang</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #171b18;
        background: #f4f1e8;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid rgb(23 27 24 / 16%);
        border-radius: 1.5rem;
        background: rgb(255 255 255 / 62%);
        box-shadow: 0 1.5rem 4rem rgb(16 22 18 / 10%);
      }

      p:first-child {
        margin: 0 0 1rem;
        color: #567563;
        font: 700 0.75rem/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.4rem, 9vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      a { color: inherit; }

      @media (prefers-color-scheme: dark) {
        body { color: #eef3ef; background: #101411; }
        main { border-color: rgb(238 243 239 / 14%); background: rgb(255 255 255 / 5%); }
        p:first-child { color: #9bc9ad; }
      }
    </style>
  </head>
  <body>
    <main>
      <p>ERROR / 404</p>
      <h1>走错了一条路径。</h1>
      <p>四秒后返回主页，也可以现在就 <a href="/">回到首页</a>。</p>
    </main>
  </body>
</html>
